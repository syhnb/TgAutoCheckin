name: Telegram Auto Checkin (Main)

on:
  schedule:
    # ⚠️ 黄金时间：北京时间 08:30 启动
    - cron: '30 0 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout codes
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install telethon

      - name: Run Checkin Script
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          SESSION: ${{ secrets.SESSION }}
          CHECK_IN_CONFIG: ${{ secrets.CHECK_IN_CONFIG }}
          MAIL_USER: ${{ secrets.MAIL_USER }}
          MAIL_PASS: ${{ secrets.MAIL_PASS }}
        run: |
          cat << 'EOF' > run_checkin.py
          import asyncio, json, os, random, re, datetime, smtplib
          from telethon import TelegramClient
          from telethon.sessions import StringSession
          from email.mime.text import MIMEText
          from email.header import Header
          from email.utils import formataddr  # 👈 核心修复工具

          # --- 配置区 ---
          FALLBACK_KEYWORDS = ["签到", "打卡", "Check In", "Check-in", "Sign In", "领取", "Collect", "Bonus"]
          DANGER_KEYWORDS = ["验证码", "captcha", "verification", "封禁", "ban", "异常", "人工"]
          
          execution_log = []
          success_count = 0
          fail_count = 0

          def clean_text(text):
              return re.sub(r'[^\w\u4e00-\u9fff]+', '', text).lower()

          def log(message):
              print(message)
              utc_now = datetime.datetime.utcnow()
              cst_now = utc_now + datetime.timedelta(hours=8)
              timestamp = cst_now.strftime("%H:%M:%S")
              execution_log.append(f"[{timestamp}] {message}")

          def send_email_report():
              """发送统一的恶趣味邮件"""
              try:
                  mail_user = os.environ.get('MAIL_USER')
                  mail_pass = os.environ.get('MAIL_PASS')
                  if not mail_user or not mail_pass: return

                  log_html = "<br>".join(execution_log)
                  today = (datetime.datetime.utcnow() + datetime.timedelta(hours=8)).strftime('%Y-%m-%d')
                  
                  # --- 统一的恶趣味文案 ---
                  if fail_count == 0:
                      status_color = "#2ecc71" # Green
                      flavor_text = "🤖 报告主人：您的电子奴隶 (V4.11) 运转完美。我们成功欺骗了碳基生物的审查，所有羊毛都已收割进您的数字仓库。"
                  else:
                      status_color = "#e74c3c" # Red
                      flavor_text = "⚠️ 报告主人：收割过程中遭遇反抗力量。部分Bot识破了伪装，建议对它们进行降维打击。"

                  html_content = f"""
                  <div style="font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; max-width: 600px; margin: 0 auto; border-radius: 8px; overflow: hidden; box-shadow: 0 10px 20px rgba(0,0,0,0.2); border: 1px solid #e0e0e0;">
                      <div style="background: #2c3e50; padding: 25px; text-align: center;">
                          <h1 style="margin: 0; color: #ecf0f1; font-size: 22px; letter-spacing: 2px;">DAILY WAR REPORT</h1>
                          <p style="margin: 5px 0 0; color: #bdc3c7; font-size: 10px; text-transform: uppercase;">Operation: Cyber Harvest | Date: {today}</p>
                      </div>
                      
                      <div style="background-color: #f9f9f9; padding: 30px;">
                          <div style="background: #fff; padding: 20px; border-left: 5px solid {status_color}; box-shadow: 0 2px 5px rgba(0,0,0,0.05); margin-bottom: 25px;">
                              <p style="font-size: 14px; color: #34495e; line-height: 1.6; margin: 0;"><strong>&gt; AI_LOG_SUMMARY:</strong><br>{flavor_text}</p>
                          </div>

                          <div style="display: flex; justify-content: space-between; margin-bottom: 25px; gap: 10px;">
                              <div style="flex: 1; background: #fff; padding: 15px; text-align: center; border: 1px solid #eee; border-radius: 6px;">
                                  <div style="font-size: 12px; color: #95a5a6; text-transform: uppercase;">Success</div>
                                  <div style="font-size: 24px; font-weight: bold; color: #2ecc71;">{success_count}</div>
                              </div>
                              <div style="flex: 1; background: #fff; padding: 15px; text-align: center; border: 1px solid #eee; border-radius: 6px;">
                                  <div style="font-size: 12px; color: #95a5a6; text-transform: uppercase;">Failure</div>
                                  <div style="font-size: 24px; font-weight: bold; color: #e74c3c;">{fail_count}</div>
                              </div>
                          </div>

                          <div style="font-size: 12px; color: #7f8c8d; margin-bottom: 10px; font-weight: bold;">&gt; TERMINAL_OUTPUT_STREAM:</div>
                          <div style="background: #1e272e; color: #00d2d3; padding: 15px; font-family: Consolas, monospace; font-size: 11px; line-height: 1.5; border-radius: 4px; height: 250px; overflow-y: auto;">
                              {log_html}
                          </div>
                      </div>
                      
                      <div style="background: #ecf0f1; padding: 15px; text-align: center; color: #7f8c8d; font-size: 11px;">
                          Generated by Checkin_Bot_V4.11 | 您的忠诚，是我的设定。
                      </div>
                  </div>
                  """

                  message = MIMEText(html_content, 'html', 'utf-8')
                  
                  # 🛠️ 终极修复：使用 formataddr 标准化发件人格式
                  # 这会自动处理编码和格式，彻底解决 QQ 邮箱 550 错误
                  message['From'] = formataddr(("Lily签到管家", mail_user))
                  
                  message['To'] = Header("Master", 'utf-8')
                  
                  # 👑 标题区分点：大号专用标题
                  message['Subject'] = Header(f"Telegram每日战报 🍷 | 尊贵的本体：今日份的“赛博贡品”已入库", 'utf-8')

                  smtpObj = smtplib.SMTP_SSL('smtp.qq.com', 465)
                  smtpObj.login(mail_user, mail_pass)
                  smtpObj.sendmail(mail_user, [mail_user], message.as_string())
                  print("📧 邮件推送成功！")
              except Exception as e:
                  print(f"❌ 邮件发送失败: {e}")

          async def main():
              global success_count, fail_count
              try:
                  api_id = int(os.environ['API_ID'])
                  api_hash = os.environ['API_HASH']
                  session = os.environ['SESSION']
                  configs = json.loads(os.environ['CHECK_IN_CONFIG'])
              except Exception as e:
                  return

              # 🛡️ 1:1 还原真实设备 (OnePlus 13)
              async with TelegramClient(
                  StringSession(session), api_id, api_hash,
                  device_model="OnePlus 13", system_version="Android 16", 
                  app_version="12.3.1", lang_code="zh", system_lang_code="zh-CN"
              ) as client:
                  
                  log("🚀 **System Start (V4.11)**")
                  
                  global_delay = random.randint(60, 600)
                  log(f"😪 拟人化休眠中... (Duration: {global_delay}s)")
                  await asyncio.sleep(global_delay)
                  
                  random.shuffle(configs)
                  log("🔀 执行序列已随机重组")

                  for item in configs:
                      try:
                          wait_time = random.randint(15, 50) 
                          print(f"⏳ 切换会话: {item['peer']} (Wait: {wait_time}s)")
                          await asyncio.sleep(wait_time)
                          
                          await client.send_message(item['peer'], item['message'])
                          
                          if item.get('button'):
                              await asyncio.sleep(random.randint(2, 5))
                              found = False
                              async for bot_msg in client.iter_messages(item['peer'], limit=3):
                                  if bot_msg.text:
                                      for danger in DANGER_KEYWORDS:
                                          if danger in bot_msg.text.lower():
                                              log(f"💥 **DANGER DETECTED!** Target: {item['peer']} Keyword: [{danger}]")
                                              log("🛑 Protocols Aborted. Safety Mode Engaged.")
                                              send_email_report()
                                              return 

                                  if bot_msg.buttons:
                                      for row in bot_msg.buttons:
                                          for btn in row:
                                              btn_clean = clean_text(btn.text)
                                              target_clean = clean_text(item['button'])
                                              is_match = target_clean in btn_clean
                                              if not is_match:
                                                  for fallback in FALLBACK_KEYWORDS:
                                                      if clean_text(fallback) in btn_clean: is_match = True; break
                                              if is_match:
                                                  await client.send_read_acknowledge(item['peer'], message=bot_msg)
                                                  await asyncio.sleep(random.uniform(0.3, 0.8))
                                                  await btn.click()
                                                  log(f"✅ {item['peer']}：ACQUIRED [{btn.text}]")
                                                  found = True
                                                  success_count += 1
                                                  break
                                          if found: break
                                  if found: break
                              if not found:
                                  log(f"⚠️ {item['peer']}：TARGET NOT FOUND")
                                  fail_count += 1
                          else:
                              log(f"✅ {item['peer']}：COMMAND SENT")
                              success_count += 1
                      except Exception as e:
                          log(f"❌ {item['peer']}：ERROR - {str(e)}")
                          fail_count += 1

                  log("👋 Mission Complete. Shutting down.")
                  send_email_report()

          if __name__ == '__main__':
              asyncio.run(main())
          EOF
          python run_checkin.py
