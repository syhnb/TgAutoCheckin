name: Telegram Auto Checkin (Main)

on:
  schedule:
    # ✅ 北京时间 7, 8, 9, 10, 11 点整唤醒
    - cron: '5 23,0-3 * * *'
  workflow_dispatch:
    inputs:
      force_run:
        description: '强制运行 (无视吉时)'
        required: false
        type: boolean
        default: false

# ⚡ 关键权限：允许脚本读写 GitHub Issues (用于记账)
permissions:
  contents: read
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout codes
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install telethon requests

      - name: Run Checkin Script
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          SESSION: ${{ secrets.SESSION }}
          CHECK_IN_CONFIG: ${{ secrets.CHECK_IN_CONFIG }}
          MAIL_USER: ${{ secrets.MAIL_USER }}
          MAIL_PASS: ${{ secrets.MAIL_PASS }}
          FORCE_RUN: ${{ inputs.force_run }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }} 
          GH_REPO: ${{ github.repository }}
        run: |
          cat << 'EOF' > run_checkin.py
          import asyncio, json, os, random, re, datetime, smtplib, time, requests
          from telethon import TelegramClient
          from telethon.sessions import StringSession
          from email.mime.text import MIMEText
          from email.header import Header
          from email.utils import formataddr

          # ==========================================
          # 👇 身份标识：大号
          AC_TAG = "大号"
          # ==========================================

          # --- 基础配置 ---
          FALLBACK_KEYWORDS = ["签到", "打卡", "Check In", "Check-in", "Sign In", "领取", "Collect", "Bonus"]
          FOCUS_PEER = "@lilyembybot"

          execution_log = []
          success_count = 0
          fail_count = 0

          def clean_text(text):
              return re.sub(r'[^\w\u4e00-\u9fff]+', '', text).lower()

          def log(message):
              print(message)
              utc_now = datetime.datetime.utcnow()
              cst_now = utc_now + datetime.timedelta(hours=8)
              timestamp = cst_now.strftime("%H:%M:%S")
              execution_log.append(f"[{timestamp}] {message}")

          # =========== GitHub Issues 账本逻辑 ===========
          def check_github_ledger(today_str):
              token = os.environ.get('GH_TOKEN')
              repo = os.environ.get('GH_REPO')
              if not token or not repo: return False, None
              
              headers = {"Authorization": f"token {token}", "Accept": "application/vnd.github.v3+json"}
              api_url = f"https://api.github.com/repos/{repo}/issues"
              
              issue_number = None
              try:
                  params = {"state": "open", "creator": "app/github-actions"}
                  resp = requests.get(api_url, headers=headers, params=params)
                  issues = resp.json()
                  
                  for issue in issues:
                      if issue['title'] == "📅 每日签到日志 (自动维护)":
                          issue_number = issue['number']
                          break
                  
                  if not issue_number:
                      log("📘 未找到账本，正在创建新的 GitHub Issue...")
                      create_data = {
                          "title": "📅 每日签到日志 (自动维护)",
                          "body": "此 Issue 用于记录脚本签到状态，请勿手动关闭。\n\n**History:**"
                      }
                      create_resp = requests.post(api_url, headers=headers, json=create_data)
                      if create_resp.status_code == 201:
                          issue_number = create_resp.json()['number']
                      else:
                          log(f"⚠️ 创建账本失败: {create_resp.text}")
                          return False, None
                  
                  comments_url = f"https://api.github.com/repos/{repo}/issues/{issue_number}/comments"
                  comments_resp = requests.get(comments_url, headers=headers)
                  comments = comments_resp.json()
                  
                  marker = f"✅ {today_str}"
                  for comment in reversed(comments):
                      if marker in comment['body']:
                          return True, issue_number
                  
                  return False, issue_number

              except Exception as e:
                  log(f"⚠️ GitHub API 错误: {e}")
                  return False, None

          def write_github_ledger(issue_number, today_str):
              token = os.environ.get('GH_TOKEN')
              repo = os.environ.get('GH_REPO')
              if not token or not repo or not issue_number: return
              
              headers = {"Authorization": f"token {token}", "Accept": "application/vnd.github.v3+json"}
              url = f"https://api.github.com/repos/{repo}/issues/{issue_number}/comments"
              
              data = {"body": f"✅ {today_str} 任务已完成 ({AC_TAG})"}
              try:
                  requests.post(url, headers=headers, json=data)
                  log(f"📘 已在 GitHub Issue 记录今日战绩")
              except: pass
          # ===========================================

          def send_email_report():
              try:
                  mail_user = os.environ.get('MAIL_USER')
                  mail_pass = os.environ.get('MAIL_PASS')
                  if not mail_user or not mail_pass: return

                  log_html = "<br>".join(execution_log)
                  today = (datetime.datetime.utcnow() + datetime.timedelta(hours=8)).strftime('%Y-%m-%d')
                  
                  focus_status = "❌ 未检测到运行"
                  focus_emoji = "⚠️"
                  found_focus = False
                  
                  for line in execution_log:
                      if FOCUS_PEER in line:
                          found_focus = True
                          if "✅" in line or "成功" in line:
                              focus_status = "✅ 签到成功"
                              focus_emoji = "🐱"
                          elif "❌" in line:
                              focus_status = "❌ 签到失败"
                              focus_emoji = "😿"
                          break
                  if not found_focus:
                      focus_status = "⚠️ 无重点对象"
                      focus_emoji = "❓"

                  # 🎨 旧版经典 UI 还原
                  html_content = f"""
                  <div style="font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; max-width: 600px; margin: 0 auto; border: 1px solid #e0e0e0; border-radius: 8px; overflow: hidden; box-shadow: 0 4px 8px rgba(0,0,0,0.05);">
                      <div style="background: #34495e; padding: 15px 20px; text-align: left; color: #fff;">
                          <h2 style="margin:0; font-size: 18px; font-weight: 500;">📅 每日战报 ({today})</h2>
                      </div>
                      
                      <div style="background: #f4f6f7; padding: 15px 20px; border-bottom: 1px solid #e0e0e0;">
                          <div style="font-size: 12px; color: #7f8c8d; font-weight: bold; margin-bottom: 5px;">重点关注 ({FOCUS_PEER})</div>
                          <div style="font-size: 20px; font-weight: bold; color: #2c3e50; display: flex; align-items: center;">
                             <span style="margin-right: 8px;">{focus_emoji}</span> {focus_status}
                          </div>
                      </div>

                      <div style="padding: 20px;">
                          <p style="color: #34495e; font-size: 14px; margin-top: 0;">🤖 尊贵的本体：{AC_TAG} 任务执行完毕。</p>
                          
                          <div style="display: flex; gap: 10px; margin: 15px 0;">
                              <div style="flex:1; background:#e8f5e9; padding:10px; text-align:center; border-radius:4px; color:#2e7d32; font-weight:bold; font-size:14px;">
                                  ✅ 总成功: {success_count}
                              </div>
                              <div style="flex:1; background:#ffebee; padding:10px; text-align:center; border-radius:4px; color:#c62828; font-weight:bold; font-size:14px;">
                                  ❌ 总失败: {fail_count}
                              </div>
                          </div>
                          
                          <div style="background:#f8f9fa; padding:15px; font-size:12px; font-family: 'Courier New', monospace; height:320px; overflow-y:auto; border: 1px solid #eee; border-radius: 4px; line-height: 1.5;">
                              {log_html}
                          </div>
                      </div>
                  </div>
                  """
                  message = MIMEText(html_content, 'html', 'utf-8')
                  message['From'] = formataddr(("Telegram管家", mail_user))
                  message['To'] = Header("Master", 'utf-8')
                  status_icon = "✅" if fail_count == 0 else "⚠️"
                  message['Subject'] = Header(f"TG战报 ({AC_TAG}) | {status_icon} 完成:{success_count}", 'utf-8')
                  smtpObj = smtplib.SMTP_SSL('smtp.qq.com', 465)
                  smtpObj.login(mail_user, mail_pass)
                  smtpObj.sendmail(mail_user, [mail_user], message.as_string())
                  print("📧 邮件发送成功")
              except Exception as e: print(f"❌ 邮件失败: {e}")

          async def main():
              global success_count, fail_count
              try:
                  api_id = int(os.environ['API_ID'])
                  api_hash = os.environ['API_HASH']
                  session = os.environ['SESSION']
                  configs = json.loads(os.environ['CHECK_IN_CONFIG'])
              except Exception as e:
                  print(f"❌ 配置读取失败: {e}")
                  return

              utc_now = datetime.datetime.utcnow()
              cst_now = utc_now + datetime.timedelta(hours=8)
              current_hour = cst_now.hour
              today_str = cst_now.strftime('%Y-%m-%d')
              weekday = cst_now.weekday()
              is_force = os.environ.get('FORCE_RUN') == 'true'

              # 1. 🔍 查 GitHub 账本
              log(f"🔍 [{AC_TAG}] 正在检查 GitHub Issue 账本...")
              is_done, issue_num = check_github_ledger(today_str)
              
              if is_done and not is_force:
                  log(f"🛑 发现账本已有今日 ({today_str}) 记录，停止运行。")
                  return
              
              # 2. 🎲 摇骰子
              random.seed(cst_now.timestamp())
              hit_prob = 0
              if current_hour == 7: hit_prob = 30
              elif current_hour == 8: hit_prob = 40
              elif current_hour == 9: hit_prob = 60
              elif current_hour == 10: hit_prob = 80
              elif current_hour >= 11: hit_prob = 100

              if weekday > 4: # 周末
                  if current_hour == 7: hit_prob = 10
                  elif current_hour == 8: hit_prob = 10
                  elif current_hour == 9: hit_prob = 50
              
              dice = random.randint(1, 100)
              log(f"📅 当前: {current_hour}点 | 🎲 概率: {hit_prob}% | 点数: {dice}")

              if not (dice <= hit_prob or is_force or current_hour >= 11):
                  log("💤 命运之轮决定：再睡会儿... (跳过)")
                  return

              # 3. 执行任务
              wait_seconds = random.randint(30, 300)
              if current_hour >= 11: wait_seconds = random.randint(10, 60)
              log(f"⏳ 决定执行，等待 {wait_seconds} 秒模拟前摇...")
              await asyncio.sleep(wait_seconds)

              async with TelegramClient(StringSession(session), api_id, api_hash, device_model="OnePlus 13", system_version="Android 16", app_version="12.3.1", lang_code="zh", system_lang_code="zh-CN") as client:
                  log("🚀 开始执行签到任务...")
                  random.shuffle(configs)

                  for index, item in enumerate(configs):
                      try:
                          peer = item['peer']
                          if index > 0 and index % 5 == 0: await asyncio.sleep(random.randint(20, 40))
                          await asyncio.sleep(random.choice([3, 5, 8, 12]))
                          
                          await client.send_message(peer, item['message'])
                          
                          if item.get('button'):
                              await asyncio.sleep(random.randint(3, 6))
                              found = False
                              async for bot_msg in client.iter_messages(peer, limit=3):
                                  if bot_msg.buttons:
                                      for row in bot_msg.buttons:
                                          for btn in row:
                                              if clean_text(item['button']) in clean_text(btn.text) or any(clean_text(k) in clean_text(btn.text) for k in FALLBACK_KEYWORDS):
                                                  await client.send_read_acknowledge(peer, message=bot_msg)
                                                  await asyncio.sleep(random.uniform(1.5, 3.0))
                                                  await btn.click()
                                                  log(f"✅ {peer}：点击 [{btn.text}]")
                                                  found = True
                                                  success_count += 1
                                                  break
                                          if found: break
                                  if found: break
                              if not found: log(f"⚠️ {peer}：未找到按钮")
                          else:
                              log(f"✅ {peer}：指令已发送")
                              success_count += 1
                      except Exception as e:
                          log(f"❌ {peer}：错误 - {str(e)}")
                          fail_count += 1

                  # 4. 📝 记账
                  if issue_num:
                      write_github_ledger(issue_num, today_str)

                  log("👋 任务结束。")
                  send_email_report()

          if __name__ == '__main__':
              asyncio.run(main())
          EOF
          python run_checkin.py
