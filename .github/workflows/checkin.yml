name: Telegram Auto Checkin

on:
  schedule:
    # 最终设定：北京时间凌晨 04:00 启动
    # (UTC 20:00)
    - cron: '0 20 * * *'
  workflow_dispatch: # 允许手动点击运行

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout codes
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python_version: '3.10'

      - name: Install dependencies
        run: pip install telethon

      - name: Run Checkin Script
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          SESSION: ${{ secrets.SESSION }}
          CHECK_IN_CONFIG: ${{ secrets.CHECK_IN_CONFIG }}
        run: |
          cat << 'EOF' > run_checkin.py
          import asyncio, json, os, random
          from telethon import TelegramClient
          from telethon.sessions import StringSession

          async def main():
              try:
                  api_id = int(os.environ['API_ID'])
                  api_hash = os.environ['API_HASH']
                  session = os.environ['SESSION']
                  configs = json.loads(os.environ['CHECK_IN_CONFIG'])
              except Exception as e:
                  print(f"配置读取失败: {e}")
                  return

              async with TelegramClient(StringSession(session), api_id, api_hash) as client:
                  for item in configs:
                      try:
                          # --- 1. 等待逻辑 (多账号防封优化) ---
                          if item.get('priority') == True:
                              print(f"【优先执行】Bot {item['peer']} 立即签到！")
                          else:
                              # 随机等待 10~120秒，避免 10 个账号同时操作触发风控
                              wait_time = random.randint(10, 120)
                              print(f"【队列等待】{item['peer']} 随机等待 {wait_time} 秒...")
                              await asyncio.sleep(wait_time)
                          
                          # --- 2. 发送指令 ---
                          print(f"向 {item['peer']} 发送: {item['message']}")
                          await client.send_message(item['peer'], item['message'])
                          
                          # --- 3. 智能按钮点击 (优化版：搜索最近3条) ---
                          if item.get('button'):
                              print(f"正在寻找包含 [{item['button']}] 的按钮...")
                              await asyncio.sleep(8) # 给机器人一点反应时间
                              
                              found = False
                              # 关键优化：查看最近 3 条消息
                              # 防止机器人发完面板后紧接着发了一条广告，导致脚本漏看面板
                              async for bot_msg in client.iter_messages(item['peer'], limit=3):
                                  if bot_msg.buttons:
                                      for row in bot_msg.buttons:
                                          for btn in row:
                                              # 只要按钮文字包含关键词（如"签到"）就点
                                              if item['button'] in btn.text:
                                                  await btn.click()
                                                  print(f"✅ 成功点击按钮：[{btn.text}]")
                                                  found = True
                                                  break
                                          if found: break
                                  if found: break # 找到了就停止翻找，避免误触旧消息
                              
                              if not found:
                                  print(f"⚠️ 在最近3条消息中未找到包含 [{item['button']}] 的按钮")

                      except Exception as e:
                          print(f"❌ {item['peer']} 执行失败: {e}")

          if __name__ == '__main__':
              asyncio.run(main())
          EOF
          python run_checkin.py
