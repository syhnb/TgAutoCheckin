name: Telegram Auto Checkin

on:
  schedule:
    # ⚠️ 黄金时间：北京时间 08:30 启动
    - cron: '30 0 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout codes
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install telethon

      - name: Run Checkin Script
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          SESSION: ${{ secrets.SESSION }}
          CHECK_IN_CONFIG: ${{ secrets.CHECK_IN_CONFIG }}
        run: |
          cat << 'EOF' > run_checkin.py
          import asyncio, json, os, random, re
          from telethon import TelegramClient
          from telethon.sessions import StringSession

          # --- 增强功能：智能关键词备选库 ---
          # 如果配置的“签到”没找到，脚本会自动尝试寻找这些词
          FALLBACK_KEYWORDS = ["签到", "打卡", "Check In", "Check-in", "Sign In", "领取", "Collect", "Bonus"]

          def clean_text(text):
              """清理文本：去除Emoji、空格、特殊符号，只保留核心字符"""
              # 这一步是为了防止 "✅ 签到 " 这种带符号的文本匹配失败
              return re.sub(r'[^\w\u4e00-\u9fff]+', '', text).lower()

          async def main():
              try:
                  api_id = int(os.environ['API_ID'])
                  api_hash = os.environ['API_HASH']
                  session = os.environ['SESSION']
                  configs = json.loads(os.environ['CHECK_IN_CONFIG'])
              except Exception as e:
                  print(f"配置读取失败: {e}")
                  return

              # --- 🛡️ 1:1 还原真实设备 (OnePlus 13) ---
              async with TelegramClient(
                  StringSession(session), 
                  api_id, 
                  api_hash,
                  device_model="OnePlus 13", 
                  system_version="Android 16", 
                  app_version="12.3.1",
                  lang_code="zh",
                  system_lang_code="zh-CN"
              ) as client:
                  
                  # --- 防封机制 1：全局拟人化赖床 ---
                  global_delay = random.randint(60, 600)
                  print(f"😪 【拟人化】刚醒，先发呆 {global_delay} 秒再开始干活...")
                  await asyncio.sleep(global_delay)
                  
                  # --- 防封机制 2：彻底乱序执行 ---
                  random.shuffle(configs)
                  print(f"🔀 今日签到顺序已随机打乱，老司机准备发车...")

                  for item in configs:
                      try:
                          # --- 防封机制 3：模拟切换窗口 (15~50秒) ---
                          wait_time = random.randint(15, 50) 
                          print(f"⏳ 切换到 {item['peer']}，等待 {wait_time} 秒...")
                          await asyncio.sleep(wait_time)
                          
                          # --- 发送指令 ---
                          print(f"向 {item['peer']} 发送: {item['message']}")
                          await client.send_message(item['peer'], item['message'])
                          
                          # --- 防封机制 4：拟人化视觉反应 ---
                          if item.get('button'):
                              reaction_time = random.randint(2, 5)
                              print(f"👀 等待面板弹出... ({reaction_time} 秒)")
                              await asyncio.sleep(reaction_time)
                              
                              found = False
                              async for bot_msg in client.iter_messages(item['peer'], limit=3):
                                  if bot_msg.buttons:
                                      # --- 👁️ 增强功能：视觉日志 ---
                                      # 打印出脚本究竟“看”到了哪些按钮，方便排查
                                      visible_buttons = []
                                      for row in bot_msg.buttons:
                                          for btn in row:
                                              visible_buttons.append(btn.text)
                                      print(f"🔎 屏幕识别结果: {visible_buttons}")

                                      for row in bot_msg.buttons:
                                          for btn in row:
                                              # --- 核心识别逻辑增强 ---
                                              btn_clean = clean_text(btn.text)
                                              target_clean = clean_text(item['button'])
                                              
                                              # 1. 优先匹配配置的关键词 (去噪匹配)
                                              is_match = target_clean in btn_clean
                                              
                                              # 2. 如果没匹配上，启动智能备选 (防止服主改文案)
                                              if not is_match:
                                                  for fallback in FALLBACK_KEYWORDS:
                                                      if clean_text(fallback) in btn_clean:
                                                          is_match = True
                                                          print(f"💡 触发智能识别：原定[{item['button']}]未找到，但发现了同义词[{btn.text}]")
                                                          break

                                              if is_match:
                                                  # --- 防封机制 5：发送“已读”回执 ---
                                                  await client.send_read_acknowledge(item['peer'], message=bot_msg)
                                                  print(f"👁️ 已标记消息为[已读] (双勾)")
                                                  
                                                  # 触觉延迟
                                                  await asyncio.sleep(random.uniform(0.3, 0.8))
                                                  await btn.click()
                                                  print(f"✅ 极速点击：[{btn.text}]")
                                                  found = True
                                                  break
                                          if found: break
                                  if found: break
                              if not found:
                                  print(f"⚠️ 未找到目标按钮，且智能备选也未匹配成功。")
                      except Exception as e:
                          print(f"❌ {item['peer']} 执行失败: {e}")

          if __name__ == '__main__':
              asyncio.run(main())
          EOF
          python run_checkin.py
