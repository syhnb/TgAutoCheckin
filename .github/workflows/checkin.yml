name: Telegram Auto Checkin

on:
  schedule:
    # 每天北京时间 04:30 启动 (UTC 20:30)
    - cron: '30 20 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout codes
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # 👇 之前是 python_version (下划线)，现在改成了 python-version (减号)
          # 这样就不会有黄色叹号警告了
          python-version: '3.10'

      - name: Install dependencies
        run: pip install telethon

      - name: Run Checkin Script
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          SESSION: ${{ secrets.SESSION }}
          CHECK_IN_CONFIG: ${{ secrets.CHECK_IN_CONFIG }}
        run: |
          cat << 'EOF' > run_checkin.py
          import asyncio, json, os, random
          from telethon import TelegramClient
          from telethon.sessions import StringSession

          async def main():
              try:
                  api_id = int(os.environ['API_ID'])
                  api_hash = os.environ['API_HASH']
                  session = os.environ['SESSION']
                  configs = json.loads(os.environ['CHECK_IN_CONFIG'])
              except Exception as e:
                  print(f"配置读取失败: {e}")
                  return

              async with TelegramClient(StringSession(session), api_id, api_hash) as client:
                  # --- 1. 全局拟人化等待 (睡懒觉) ---
                  # 脚本启动后，随机发呆 10秒 ~ 15分钟
                  global_delay = random.randint(10, 900)
                  print(f"😪 【拟人化】脚本决定先睡个懒觉，{global_delay} 秒后再开始工作...")
                  await asyncio.sleep(global_delay)
                  print(f"⏰ 睡醒了！现在开始执行签到任务...")

                  for item in configs:
                      try:
                          # --- 2. 内部队列等待 ---
                          if item.get('priority') == True:
                              print(f"【优先执行】Bot {item['peer']} 立即签到！")
                          else:
                              wait_time = random.randint(10, 120)
                              print(f"【队列等待】{item['peer']} 随机等待 {wait_time} 秒...")
                              await asyncio.sleep(wait_time)
                          
                          # --- 3. 发送指令 ---
                          print(f"向 {item['peer']} 发送: {item['message']}")
                          await client.send_message(item['peer'], item['message'])
                          
                          # --- 4. 智能按钮点击 (搜最近3条) ---
                          if item.get('button'):
                              print(f"正在寻找包含 [{item['button']}] 的按钮...")
                              await asyncio.sleep(8)
                              found = False
                              async for bot_msg in client.iter_messages(item['peer'], limit=3):
                                  if bot_msg.buttons:
                                      for row in bot_msg.buttons:
                                          for btn in row:
                                              if item['button'] in btn.text:
                                                  await btn.click()
                                                  print(f"✅ 成功点击按钮：[{btn.text}]")
                                                  found = True
                                                  break
                                          if found: break
                                  if found: break
                              if not found:
                                  print(f"⚠️ 未找到包含 [{item['button']}] 的按钮")
                      except Exception as e:
                          print(f"❌ {item['peer']} 执行失败: {e}")

          if __name__ == '__main__':
              asyncio.run(main())
          EOF
          python run_checkin.py
