name: Telegram Auto Checkin (Main)

on:
  schedule:
    - cron: '12 23 * * *'
    - cron: '38 0 * * *'
    - cron: '24 1 * * *'
    - cron: '45 2 * * *'
    - cron: '2 3 * * *'
  workflow_dispatch:
    inputs:
      force_run:
        description: '强制运行 (无视吉时)'
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout codes
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install telethon requests

      - name: Run Checkin Script
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          SESSION: ${{ secrets.SESSION }}
          CHECK_IN_CONFIG: ${{ secrets.CHECK_IN_CONFIG }}
          MAIL_USER: ${{ secrets.MAIL_USER }}
          MAIL_PASS: ${{ secrets.MAIL_PASS }}
          FORCE_RUN: ${{ inputs.force_run }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }} 
          GH_REPO: ${{ github.repository }}
        run: |
          cat << 'EOF' > run_checkin.py
          import asyncio, json, os, random, re, datetime, smtplib, time, requests
          from telethon import TelegramClient
          from telethon.sessions import StringSession
          from email.mime.text import MIMEText
          from email.header import Header
          from email.utils import formataddr

          # ==========================================
          # 👇 身份标识：大号
          AC_TAG = "大号"
          # ==========================================

          FALLBACK_KEYWORDS = ["签到", "打卡", "Check In", "Check-in", "Sign In", "领取", "Collect", "Bonus"]
          FOCUS_PEER = "@lilyembybot"

          # 状态分类日志 (取代原有的单一日志)
          log_success = []
          log_warn = []
          log_fail = []
          general_log = []

          def clean_text(text):
              return re.sub(r'[^\w\u4e00-\u9fff]+', '', text).lower()

          def sys_log(message):
              print(message)
              utc_now = datetime.datetime.utcnow()
              cst_now = utc_now + datetime.timedelta(hours=8)
              timestamp = cst_now.strftime("%H:%M:%S")
              general_log.append(f"[{timestamp}] {message}")

          # =========== GitHub Issues 按月账本逻辑 ===========
          def check_github_ledger(today_str, month_str):
              token = os.environ.get('GH_TOKEN')
              repo = os.environ.get('GH_REPO')
              if not token or not repo: return False, None
              
              headers = {"Authorization": f"token {token}", "Accept": "application/vnd.github.v3+json"}
              api_url = f"https://api.github.com/repos/{repo}/issues"
              ledger_title = f"📅 签到账本 ({month_str})"
              
              issue_number = None
              try:
                  params = {"state": "open", "creator": "app/github-actions"}
                  resp = requests.get(api_url, headers=headers, params=params)
                  issues = resp.json()
                  for issue in issues:
                      if issue['title'] == ledger_title:
                          issue_number = issue['number']
                          break
                  if not issue_number:
                      sys_log(f"📘 未找到本月账本，正在创建 {ledger_title}...")
                      create_data = {"title": ledger_title, "body": "此 Issue 用于记录本月脚本签到状态，跨月将自动建新帖。\n\n**History:**"}
                      create_resp = requests.post(api_url, headers=headers, json=create_data)
                      if create_resp.status_code == 201: issue_number = create_resp.json()['number']
                      else: return False, None
                  
                  comments_url = f"https://api.github.com/repos/{repo}/issues/{issue_number}/comments?per_page=100"
                  comments_resp = requests.get(comments_url, headers=headers)
                  comments = comments_resp.json()
                  
                  marker = f"✅ {today_str}"
                  for comment in reversed(comments):
                      if marker in comment['body']: return True, issue_number
                  return False, issue_number
              except: return False, None

          def write_github_ledger(issue_number, today_str):
              token = os.environ.get('GH_TOKEN')
              repo = os.environ.get('GH_REPO')
              if not token or not repo or not issue_number: return
              headers = {"Authorization": f"token {token}", "Accept": "application/vnd.github.v3+json"}
              url = f"https://api.github.com/repos/{repo}/issues/{issue_number}/comments"
              data = {"body": f"✅ {today_str} 任务已完成 ({AC_TAG})"}
              try: requests.post(url, headers=headers, json=data)
              except: pass
          # ===========================================

          def send_email_report():
              try:
                  mail_user = os.environ.get('MAIL_USER')
                  mail_pass = os.environ.get('MAIL_PASS')
                  if not mail_user or not mail_pass: return
                  
                  today = (datetime.datetime.utcnow() + datetime.timedelta(hours=8)).strftime('%Y-%m-%d')
                  
                  # 判定重点关注对象的状态
                  focus_status = "💤 未检测到运行"
                  focus_emoji = "❔"
                  if any(FOCUS_PEER in s for s in log_success):
                      focus_status = "✅ 签到成功"; focus_emoji = "🐱"
                  elif any(FOCUS_PEER in s for s in log_warn):
                      focus_status = "⚠️ 未找到按钮或异常"; focus_emoji = "🙀"
                  elif any(FOCUS_PEER in s for s in log_fail):
                      focus_status = "❌ 签到失败报错"; focus_emoji = "😿"

                  # 动态生成 HTML 详情区块
                  html_details = ""
                  if log_fail:
                      html_details += f"<div style='color:#c62828; font-weight:bold; margin-top:15px; font-size:14px;'>❌ 失败列表 ({len(log_fail)})</div>"
                      html_details += f"<div style='background:#ffebee; padding:10px; border-radius:4px; font-size:12px; margin-top:5px; line-height:1.6;'>{'<br>'.join(log_fail)}</div>"
                  if log_warn:
                      html_details += f"<div style='color:#ef6c00; font-weight:bold; margin-top:15px; font-size:14px;'>⚠️ 异常列表 ({len(log_warn)})</div>"
                      html_details += f"<div style='background:#fff3e0; padding:10px; border-radius:4px; font-size:12px; margin-top:5px; line-height:1.6;'>{'<br>'.join(log_warn)}</div>"
                  if log_success:
                      html_details += f"<div style='color:#2e7d32; font-weight:bold; margin-top:15px; font-size:14px;'>✅ 成功列表 ({len(log_success)})</div>"
                      html_details += f"<div style='background:#e8f5e9; padding:10px; border-radius:4px; font-size:12px; margin-top:5px; line-height:1.6;'>{'<br>'.join(log_success)}</div>"

                  html_content = f"""
                  <div style="font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; max-width: 600px; margin: 0 auto; border: 1px solid #e0e0e0; border-radius: 8px; overflow: hidden; box-shadow: 0 4px 8px rgba(0,0,0,0.05);">
                      <div style="background: #34495e; padding: 15px 20px; text-align: left; color: #fff;">
                          <h2 style="margin:0; font-size: 18px; font-weight: 500;">📅 每日战报 ({today})</h2>
                      </div>
                      <div style="background: #f4f6f7; padding: 15px 20px; border-bottom: 1px solid #e0e0e0;">
                          <div style="font-size: 12px; color: #7f8c8d; font-weight: bold; margin-bottom: 5px;">重点关注 ({FOCUS_PEER})</div>
                          <div style="font-size: 20px; font-weight: bold; color: #2c3e50; display: flex; align-items: center;">
                             <span style="margin-right: 8px;">{focus_emoji}</span> {focus_status}
                          </div>
                      </div>
                      <div style="padding: 20px;">
                          <p style="color: #34495e; font-size: 14px; margin-top: 0;">🤖 尊贵的本体：{AC_TAG} 任务执行完毕。</p>
                          
                          <div style="display: flex; gap: 8px; margin: 15px 0;">
                              <div style="flex:1; background:#e8f5e9; padding:10px 5px; text-align:center; border-radius:4px; color:#2e7d32; font-weight:bold; font-size:13px;">✅ 成功: {len(log_success)}</div>
                              <div style="flex:1; background:#fff3e0; padding:10px 5px; text-align:center; border-radius:4px; color:#ef6c00; font-weight:bold; font-size:13px;">⚠️ 异常: {len(log_warn)}</div>
                              <div style="flex:1; background:#ffebee; padding:10px 5px; text-align:center; border-radius:4px; color:#c62828; font-weight:bold; font-size:13px;">❌ 失败: {len(log_fail)}</div>
                          </div>
                          
                          <div style="border-top: 1px dashed #e0e0e0; padding-top: 5px; margin-top: 15px;">
                              {html_details}
                          </div>
                      </div>
                  </div>
                  """
                  message = MIMEText(html_content, 'html', 'utf-8')
                  message['From'] = formataddr(("Telegram管家", mail_user))
                  message['To'] = Header("Master", 'utf-8')
                  
                  # 动态标题图标
                  title_icon = "✅"
                  if log_fail: title_icon = "❌"
                  elif log_warn: title_icon = "⚠️"
                  
                  message['Subject'] = Header(f"TG战报 ({AC_TAG}) | {title_icon} 成功:{len(log_success)} 异常:{len(log_warn)}", 'utf-8')
                  smtpObj = smtplib.SMTP_SSL('smtp.qq.com', 465)
                  smtpObj.login(mail_user, mail_pass)
                  smtpObj.sendmail(mail_user, [mail_user], message.as_string())
                  print("📧 分类邮件发送成功")
              except Exception as e: print(f"❌ 邮件发送报错: {e}")

          async def main():
              try:
                  api_id = int(os.environ['API_ID']); api_hash = os.environ['API_HASH']; session = os.environ['SESSION']
                  configs = json.loads(os.environ['CHECK_IN_CONFIG'])
              except: sys_log("❌ 配置读取失败"); return

              utc_now = datetime.datetime.utcnow(); cst_now = utc_now + datetime.timedelta(hours=8)
              current_hour = cst_now.hour; today_str = cst_now.strftime('%Y-%m-%d'); month_str = cst_now.strftime('%Y-%m')
              weekday = cst_now.weekday()
              is_force = os.environ.get('FORCE_RUN') == 'true'

              sys_log(f"🔍 [{AC_TAG}] 正在检查 GitHub Issue 账本...")
              is_done, issue_num = check_github_ledger(today_str, month_str)
              if is_done and not is_force: sys_log(f"🛑 今日 ({today_str}) 已签，下班。"); return

              random.seed(cst_now.timestamp())
              hit_prob = 0
              if weekday <= 4: 
                  if current_hour == 7: hit_prob = 60
                  elif current_hour == 8: hit_prob = 85
                  elif current_hour >= 9: hit_prob = 100 
              else: 
                  if current_hour <= 8: hit_prob = 0 
                  elif current_hour == 9: hit_prob = 10
                  elif current_hour == 10: hit_prob = 50
                  elif current_hour >= 11: hit_prob = 100 
              
              dice = random.randint(1, 100)
              sys_log(f"📅 当前: {current_hour}点 | 🎲 概率: {hit_prob}% | 点数: {dice}")

              if not (dice <= hit_prob or is_force or hit_prob == 100): sys_log("💤 再睡会儿..."); return

              wait_seconds = random.randint(60, 1200)
              sys_log(f"⏳ 等待 {wait_seconds} 秒模拟前摇...")
              await asyncio.sleep(wait_seconds)

              is_done_again, _ = check_github_ledger(today_str, month_str)
              if is_done_again and not is_force: sys_log("🛑 别人干过了，下班！"); return

              async with TelegramClient(StringSession(session), api_id, api_hash, device_model="OnePlus PJZ110", system_version="ColorOS 16.0.2", app_version="12.3.1", lang_code="zh", system_lang_code="zh-CN") as client:
                  sys_log("🚀 开始执行签到任务...")
                  random.shuffle(configs)
                  for index, item in enumerate(configs):
                      try:
                          peer = item['peer']
                          if index > 0 and index % 5 == 0: await asyncio.sleep(random.randint(20, 40))
                          await asyncio.sleep(random.choice([3, 5, 8, 12]))
                          await client.send_message(peer, item['message'])
                          if item.get('button'):
                              await asyncio.sleep(random.randint(3, 6))
                              found = False
                              async for bot_msg in client.iter_messages(peer, limit=3):
                                  if bot_msg.buttons:
                                      for row in bot_msg.buttons:
                                          for btn in row:
                                              if clean_text(item['button']) in clean_text(btn.text) or any(clean_text(k) in clean_text(btn.text) for k in FALLBACK_KEYWORDS):
                                                  await client.send_read_acknowledge(peer, message=bot_msg)
                                                  await asyncio.sleep(random.uniform(1.5, 3.0))
                                                  await btn.click()
                                                  log_success.append(f"{peer}: 点击 [{btn.text}]")
                                                  print(f"✅ {peer}: 点击 [{btn.text}]")
                                                  found = True; break
                                          if found: break
                                  if found: break
                              if not found: 
                                  log_warn.append(f"{peer}: 未找到按钮")
                                  print(f"⚠️ {peer}: 未找到按钮")
                          else: 
                              log_success.append(f"{peer}: 指令已发送")
                              print(f"✅ {peer}: 指令已发送")
                      except Exception as e: 
                          log_fail.append(f"{peer}: 报错 - {str(e)}")
                          print(f"❌ {peer}: 报错 - {str(e)}")

                  if issue_num: write_github_ledger(issue_num, today_str)
                  sys_log("👋 任务结束。"); send_email_report()

          if __name__ == '__main__':
              asyncio.run(main())
          EOF
          python run_checkin.py
