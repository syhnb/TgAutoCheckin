name: Telegram Auto Checkin (Main)

on:
  schedule:
    # 每天 UTC 23,0,1,2 点 (对应北京 7,8,9,10 点) 的第 5 分钟尝试运行
    - cron: '5 23,0,1,2 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout codes
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install telethon

      - name: Run Checkin Script
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          SESSION: ${{ secrets.SESSION }}
          CHECK_IN_CONFIG: ${{ secrets.CHECK_IN_CONFIG }}
          MAIL_USER: ${{ secrets.MAIL_USER }}
          MAIL_PASS: ${{ secrets.MAIL_PASS }}
        run: |
          cat << 'EOF' > run_checkin.py
          import asyncio, json, os, random, re, datetime, smtplib, time
          from telethon import TelegramClient
          from telethon.sessions import StringSession
          from email.mime.text import MIMEText
          from email.header import Header
          from email.utils import formataddr

          # --- 配置区 ---
          FALLBACK_KEYWORDS = ["签到", "打卡", "Check In", "Check-in", "Sign In", "领取", "Collect", "Bonus"]
          DANGER_KEYWORDS = ["验证码", "captcha", "verification", "封禁", "ban", "异常", "人工"]
          
          # ⭐ 重点关注对象 (你想在邮件里置顶显示的机器人ID)
          FOCUS_PEER = "@lilyembybot"

          execution_log = []
          success_count = 0
          fail_count = 0

          def clean_text(text):
              return re.sub(r'[^\w\u4e00-\u9fff]+', '', text).lower()

          def log(message):
              print(message)
              utc_now = datetime.datetime.utcnow()
              cst_now = utc_now + datetime.timedelta(hours=8)
              timestamp = cst_now.strftime("%H:%M:%S")
              execution_log.append(f"[{timestamp}] {message}")

          def send_email_report():
              try:
                  mail_user = os.environ.get('MAIL_USER')
                  mail_pass = os.environ.get('MAIL_PASS')
                  if not mail_user or not mail_pass:
                      print("⚠️ 警告：未配置邮箱，跳过发送。")
                      return

                  log_html = "<br>".join(execution_log)
                  today = (datetime.datetime.utcnow() + datetime.timedelta(hours=8)).strftime('%Y-%m-%d')
                  
                  # 🔍 特写逻辑：扫描日志寻找 Lily 的下落
                  focus_status = "❓ 未执行/未找到"
                  focus_color = "#95a5a6" # 灰色
                  focus_bg = "#f3f4f6"
                  
                  for line in execution_log:
                      if FOCUS_PEER in line:
                          if "✅" in line:
                              focus_status = "✅ 签到成功"
                              focus_color = "#2e7d32" # 绿色
                              focus_bg = "#e8f5e9"
                          elif "❌" in line or "⚠️" in line:
                              focus_status = "❌ 签到失败"
                              focus_color = "#c62828" # 红色
                              focus_bg = "#ffebee"
                          break # 找到最近的一条状态就停止

                  # 👑 大号文案
                  flavor_text = "🤖 尊贵的本体：任务已完成。"
                  if fail_count > 0:
                      flavor_text += f" 注意：有 {fail_count} 个失败。"

                  html_content = f"""
                  <div style="font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; max-width: 600px; margin: 0 auto; border: 1px solid #e0e0e0; border-radius: 8px; overflow: hidden;">
                      <div style="background: #2c3e50; padding: 20px; text-align: center; color: #fff;">
                          <h2 style="margin:0;">📅 每日战报 ({today})</h2>
                      </div>
                      
                      <div style="background: {focus_bg}; padding: 15px 20px; border-bottom: 1px solid #e0e0e0; display: flex; align-items: center; justify-content: space-between;">
                          <div>
                              <span style="font-size: 12px; color: #7f8c8d; font-weight: bold; text-transform: uppercase;">重点关注 ({FOCUS_PEER})</span>
                              <div style="font-size: 24px; font-weight: bold; color: {focus_color}; margin-top: 5px;">
                                  {focus_status}
                              </div>
                          </div>
                          <div style="font-size: 30px;">🐱</div>
                      </div>
                      <div style="padding: 20px;">
                          <p style="color: #34495e; font-size: 14px; margin-top: 0;">{flavor_text}</p>
                          <div style="display: flex; gap: 10px; margin: 20px 0;">
                              <div style="flex:1; background:#f1f8e9; padding:10px; text-align:center; border-radius:4px; color:#2e7d32;">
                                  ✅ 总成功: <strong>{success_count}</strong>
                              </div>
                              <div style="flex:1; background:#ffebee; padding:10px; text-align:center; border-radius:4px; color:#c62828;">
                                  ❌ 总失败: <strong>{fail_count}</strong>
                              </div>
                          </div>
                          <div style="background:#f8f9fa; padding:15px; font-size:12px; font-family:monospace; height:300px; overflow-y:auto; border-radius:4px; border: 1px solid #eee;">
                              {log_html}
                          </div>
                      </div>
                  </div>
                  """

                  message = MIMEText(html_content, 'html', 'utf-8')
                  message['From'] = formataddr(("Telegram管家", mail_user))
                  message['To'] = Header("Master", 'utf-8')
                  # 标题带上 Lily 的状态
                  subject_icon = "✅" if "成功" in focus_status else "❌"
                  message['Subject'] = Header(f"TG战报 🍷 | {subject_icon} Lily | 总计:{success_count}/{success_count+fail_count}", 'utf-8')

                  smtpObj = smtplib.SMTP_SSL('smtp.qq.com', 465)
                  smtpObj.login(mail_user, mail_pass)
                  smtpObj.sendmail(mail_user, [mail_user], message.as_string())
                  print("📧 邮件发送成功")
              except Exception as e:
                  print(f"❌ 邮件失败: {e}")

          async def main():
              global success_count, fail_count
              try:
                  api_id = int(os.environ['API_ID'])
                  api_hash = os.environ['API_HASH']
                  session = os.environ['SESSION']
                  configs = json.loads(os.environ['CHECK_IN_CONFIG'])
              except Exception as e:
                  print(f"❌ 配置读取失败: {e}")
                  return

              # =========== 🛡️ V4.17 核心：每日彩票 + 全时段漫游 ===========
              utc_now = datetime.datetime.utcnow()
              cst_now = utc_now + datetime.timedelta(hours=8)
              current_hour = cst_now.hour
              today_str = cst_now.strftime('%Y%m%d')
              
              random.seed(today_str)
              candidate_hours = [7, 8, 9, 10]
              weights = [20, 35, 30, 15]
              target_hour = random.choices(candidate_hours, weights=weights, k=1)[0]
              random.seed()
              
              print(f"📅 日期: {today_str} | 🎰 今日吉时: {target_hour}点 | ⌚ 当前: {current_hour}点")

              if current_hour != target_hour:
                  print(f"💤 还没到点，继续潜伏... (Exit)")
                  return

              real_delay = random.randint(60, 3000)
              expected_time = cst_now + datetime.timedelta(seconds=real_delay)
              print(f"⏰ 吉时已到！启动漫游模式... (延迟 {real_delay//60} 分钟)")
              print(f"🎯 预计执行时间: {expected_time.strftime('%H:%M:%S')}")
              
              await asyncio.sleep(real_delay)

              # =========== 🚀 开始执行 ===========
              
              async with TelegramClient(StringSession(session), api_id, api_hash, device_model="OnePlus 13", system_version="Android 16", app_version="12.3.1", lang_code="zh", system_lang_code="zh-CN") as client:
                  
                  log("🚀 System Online")

                  print("👀 正在加载对话列表...")
                  await client.get_dialogs(limit=random.randint(5, 10))
                  await asyncio.sleep(random.randint(2, 5))

                  random.shuffle(configs)

                  for item in configs:
                      try:
                          wait_time = random.randint(10, 20)
                          print(f"⏳ 切换会话: {item['peer']} (Wait: {wait_time}s)")
                          await asyncio.sleep(wait_time)
                          
                          await client.send_message(item['peer'], item['message'])
                          
                          if item.get('button'):
                              await asyncio.sleep(random.randint(2, 5))
                              found = False
                              async for bot_msg in client.iter_messages(item['peer'], limit=3):
                                  if bot_msg.text:
                                      for danger in DANGER_KEYWORDS:
                                          if danger in bot_msg.text.lower():
                                              log(f"💥 发现敏感词 [{danger}]，跳过！")
                                              send_email_report()
                                              return 

                                  if bot_msg.buttons:
                                      for row in bot_msg.buttons:
                                          for btn in row:
                                              btn_clean = clean_text(btn.text)
                                              target_clean = clean_text(item['button'])
                                              is_match = target_clean in btn_clean
                                              if not is_match:
                                                  for fallback in FALLBACK_KEYWORDS:
                                                      if clean_text(fallback) in btn_clean: is_match = True; break
                                              
                                              if is_match:
                                                  # 拟人点击
                                                  await client.send_read_acknowledge(item['peer'], message=bot_msg)
                                                  reaction_time = random.uniform(1.5, 4.0)
                                                  print(f"👀 发现按钮，手指移动中... ({reaction_time:.2f}s)")
                                                  await asyncio.sleep(reaction_time)
                                                  
                                                  await btn.click()
                                                  log(f"✅ {item['peer']}：已点击 [{btn.text}]")
                                                  found = True
                                                  success_count += 1
                                                  break
                                          if found: break
                                  if found: break
                              if not found:
                                  log(f"⚠️ {item['peer']}：未找到按钮")
                                  fail_count += 1
                          else:
                              log(f"✅ {item['peer']}：指令已发送")
                              success_count += 1
                      except Exception as e:
                          log(f"❌ {item['peer']}：错误 - {str(e)}")
                          fail_count += 1

                  log("👋 所有任务结束，下线。")
                  send_email_report()

          if __name__ == '__main__':
              asyncio.run(main())
          EOF
          python run_checkin.py
