name: Telegram Auto Checkin (Main) - V5.6

concurrency:
  group: ${{ github.workflow }}

on:
  schedule:
    - cron: '12 23 * * *'
    - cron: '38 0 * * *'
    - cron: '24 1 * * *'
    - cron: '45 2 * * *'
    - cron: '2 3 * * *'
  workflow_dispatch:
    inputs:
      force_run:
        description: '强制运行'
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout codes
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install telethon requests google-genai

      - name: Run Checkin Script
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          SESSION: ${{ secrets.SESSION }}
          CHECK_IN_CONFIG: ${{ secrets.CHECK_IN_CONFIG }}
          MAIL_USER: ${{ secrets.MAIL_USER }}
          MAIL_PASS: ${{ secrets.MAIL_PASS }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FORCE_RUN: ${{ inputs.force_run }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }} 
          GH_REPO: ${{ github.repository }}
        run: |
          cat << 'EOF' > run_checkin.py
          import asyncio, json, os, random, re, datetime, smtplib, requests
          from google import genai
          from google.genai import types
          from telethon import TelegramClient
          from telethon.sessions import StringSession
          from email.mime.text import MIMEText
          from email.header import Header
          from email.utils import formataddr

          AC_TAG, FOCUS_PEER = "大号", "@lilyembybot"
          FALLBACK_KEYWORDS = ["签到", "打卡", "Check In", "Check-in", "Sign In", "领取", "Collect", "Bonus"]
          log_success, log_warn, log_fail = [], [], []

          def clean_text(text): return re.sub(r'[^\w\u4e00-\u9fff]+', '', text).lower()

          def sys_log(message):
              print(f"[{(datetime.datetime.utcnow() + datetime.timedelta(hours=8)).strftime('%H:%M:%S')}] {message}")

          def check_github_ledger(today_str, month_str):
              token, repo = os.environ.get('GH_TOKEN'), os.environ.get('GH_REPO')
              if not token or not repo: return False, None
              headers = {"Authorization": f"token {token}", "Accept": "application/vnd.github.v3+json"}
              api_url = f"https://api.github.com/repos/{repo}/issues"
              try:
                  params = {"state": "open", "creator": "app/github-actions"}
                  resp = requests.get(api_url, headers=headers, params=params).json()
                  issue_number = next((i['number'] for i in resp if i['title'] == f"📅 签到账本 ({month_str})"), None)
                  if not issue_number:
                      issue_number = requests.post(api_url, headers=headers, json={"title": f"📅 签到账本 ({month_str})", "body": "记录"}).json().get('number')
                  page, target_str = 1, f"✅ {today_str} 任务已完成 ({AC_TAG})" 
                  while True: 
                      comments = requests.get(f"{api_url}/{issue_number}/comments?per_page=100&page={page}", headers=headers).json()
                      if not comments: break
                      if any(target_str in c['body'] for c in comments): return True, issue_number
                      if len(comments) < 100: break
                      page += 1
                  return False, issue_number
              except: return False, None

          def write_github_ledger(issue_number, today_str):
              token, repo = os.environ.get('GH_TOKEN'), os.environ.get('GH_REPO')
              headers = {"Authorization": f"token {token}", "Accept": "application/vnd.github.v3+json"}
              requests.post(f"https://api.github.com/repos/{repo}/issues/{issue_number}/comments", headers=headers, json={"body": f"✅ {today_str} 任务已完成 ({AC_TAG})"})

          async def identify_captcha(client, peer, message):
              key = os.environ.get('GEMINI_API_KEY')
              if not key: return None
              try:
                  sys_log(f"📷 发现 {peer} 验证图片，AI 极速识别中...")
                  photo_bytes = await client.download_media(message.photo, file=bytes)
                  ai_client = genai.Client(api_key=key)
                  response = ai_client.models.generate_content(
                      model='gemini-1.5-flash',
                      contents=["图中是什么？仅回答一个名词，如：报纸、熊猫、马桶", types.Part.from_bytes(data=photo_bytes, mime_type='image/jpeg')]
                  )
                  keyword = response.text.strip().lower()
                  sys_log(f"🧠 AI 极速响应: {keyword}")
                  return keyword
              except Exception as e:
                  sys_log(f"❌ 识图报错: {e}"); return None

          async def click_button(client, peer, bot_msg, target):
              if not bot_msg.buttons: return False
              keyword = await identify_captcha(client, peer, bot_msg) if bot_msg.photo else None
              for row in bot_msg.buttons:
                  for btn in row:
                      text = clean_text(btn.text)
                      if (keyword and keyword in text) or clean_text(target) in text or any(clean_text(k) in text for k in FALLBACK_KEYWORDS):
                          await client.send_read_acknowledge(peer, message=bot_msg)
                          await asyncio.sleep(random.uniform(0.5, 1.2))
                          await btn.click()
                          return btn.text
              return False

          def send_email_report():
              try:
                  mail_user, mail_pass = os.environ.get('MAIL_USER'), os.environ.get('MAIL_PASS')
                  if not mail_user or not mail_pass: return
                  today = (datetime.datetime.utcnow() + timedelta(hours=8)).strftime('%Y-%m-%d') if 'timedelta' in globals() else (datetime.datetime.utcnow() + datetime.timedelta(hours=8)).strftime('%Y-%m-%d')
                  focus_status, focus_emoji = "💤 未检测", "❔"
                  if any(FOCUS_PEER in s for s in log_success): focus_status, focus_emoji = "✅ 签到成功", "🐱"
                  elif any(FOCUS_PEER in s for s in log_warn): focus_status, focus_emoji = "⚠️ 异常", "🙀"
                  elif any(FOCUS_PEER in s for s in log_fail): focus_status, focus_emoji = "❌ 失败", "😿"

                  def format_list(title, color, log_data):
                      if not log_data: return ""
                      return f"<h3 style='color:{color}; margin-top:15px; border-bottom:1px solid #eee; padding-bottom:5px;'>{title} ({len(log_data)})</h3><div style='background:#f9f9f9; padding:12px; font-size:13px; border-radius:6px; line-height:1.6;'>{'<br>'.join(log_data)}</div>"

                  html_content = f"""
                  <div style="font-family:sans-serif; max-width:600px; margin:auto; border:1px solid #e0e0e0; border-radius:10px; overflow:hidden; box-shadow:0 4px 10px rgba(0,0,0,0.05);">
                      <div style="background:#2c3e50; color:white; padding:15px 20px; font-size:18px; font-weight:bold;">
                          📅 每日战报 ({today})
                      </div>
                      <div style="padding:20px;">
                          <div style="color:#7f8c8d; font-size:13px; margin-bottom:5px;">重点关注 ({FOCUS_PEER})</div>
                          <div style="font-size:20px; font-weight:bold; margin-bottom:20px;">
                              {focus_emoji} {focus_status}
                          </div>
                          
                          <div style="font-size:14px; color:#555; margin-bottom:15px; padding-top:15px; border-top:1px dashed #eee;">
                              🤖 尊贵的本体：{AC_TAG} 任务执行完毕。
                          </div>
                          
                          <div style="display:flex; justify-content:space-between; gap:10px; font-size:14px; font-weight:bold; text-align:center;">
                              <div style="flex:1; color:#2e7d32; background:#e8f5e9; padding:10px; border-radius:6px;">✅ 成功: {len(log_success)}</div>
                              <div style="flex:1; color:#ef6c00; background:#fff3e0; padding:10px; border-radius:6px;">⚠️ 异常: {len(log_warn)}</div>
                              <div style="flex:1; color:#c62828; background:#ffebee; padding:10px; border-radius:6px;">❌ 失败: {len(log_fail)}</div>
                          </div>
                          
                          {format_list('❌ 失败列表', '#c62828', log_fail)}
                          {format_list('⚠️ 异常列表', '#ef6c00', log_warn)}
                          {format_list('✅ 成功列表', '#2e7d32', log_success)}
                      </div>
                  </div>
                  """
                  message = MIMEText(html_content, 'html', 'utf-8')
                  message['From'] = formataddr(("Telegram管家", mail_user))
                  title_icon = "❌" if log_fail else ("⚠️" if log_warn else "✅")
                  message['Subject'] = Header(f"TG战报 ({AC_TAG}) | {title_icon} 成功:{len(log_success)} 异常:{len(log_warn)} 失败:{len(log_fail)}", 'utf-8')
                  with smtplib.SMTP_SSL('smtp.qq.com', 465) as smtp:
                      smtp.login(mail_user, mail_pass)
                      smtp.sendmail(mail_user, [mail_user], message.as_string())
              except Exception as e: print(f"📧 邮件报错: {e}")

          async def main():
              try:
                  api_id, api_hash, session = int(os.environ['API_ID']), os.environ['API_HASH'], os.environ['SESSION']
                  configs = json.loads(os.environ['CHECK_IN_CONFIG'])
              except: sys_log("❌ 配置读取失败"); return

              utc_now = datetime.datetime.utcnow() + datetime.timedelta(hours=8)
              today_str, month_str, is_force = utc_now.strftime('%Y-%m-%d'), utc_now.strftime('%Y-%m'), os.environ.get('FORCE_RUN') == 'true'

              sys_log(f"🔍 [{AC_TAG}] 检查账本..."); is_done, issue_num = check_github_ledger(today_str, month_str)
              if is_done and not is_force: sys_log("🛑 今日已签，下班。"); return

              await asyncio.sleep(random.randint(5, 15))
              async with TelegramClient(StringSession(session), api_id, api_hash, device_model="OnePlus PJZ110") as client:
                  random.shuffle(configs)
                  for index, item in enumerate(configs):
                      peer = item['peer']
                      if index > 0 and index % 5 == 0: await asyncio.sleep(random.randint(15, 25))
                      await asyncio.sleep(random.randint(5, 10))
                      try:
                          cmd_msg = await client.send_message(peer, item['message'])
                          if item.get('button'):
                              found = False
                              for _ in range(5): 
                                  await asyncio.sleep(3) 
                                  async for m in client.iter_messages(peer, limit=3):
                                      if m.id > cmd_msg.id and m.buttons: 
                                          res = await click_button(client, peer, m, item['button'])
                                          if res: 
                                              log_success.append(f"{peer}: 点击 [{res}]")
                                              sys_log(f"✅ {peer}: 绝杀成功 [{res}]")
                                              found = True
                                          break 
                                  if found: break
                              if not found: log_warn.append(f"{peer}: 识别或点击超时")
                          else: log_success.append(f"{peer}: 指令已发送")
                      except Exception as e: log_fail.append(f"{peer}: {str(e)}")
                  if issue_num: write_github_ledger(issue_num, today_str)
                  send_email_report()

          if __name__ == '__main__': asyncio.run(main())
          EOF
          python run_checkin.py
