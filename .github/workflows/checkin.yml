name: Telegram Auto Checkin

on:
  schedule:
    # ⚠️ 黄金时间：北京时间 08:30 启动
    - cron: '30 0 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout codes
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install telethon

      - name: Run Checkin Script
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          SESSION: ${{ secrets.SESSION }}
          CHECK_IN_CONFIG: ${{ secrets.CHECK_IN_CONFIG }}
        run: |
          cat << 'EOF' > run_checkin.py
          import asyncio, json, os, random
          from telethon import TelegramClient
          from telethon.sessions import StringSession

          async def main():
              try:
                  api_id = int(os.environ['API_ID'])
                  api_hash = os.environ['API_HASH']
                  session = os.environ['SESSION']
                  configs = json.loads(os.environ['CHECK_IN_CONFIG'])
              except Exception as e:
                  print(f"配置读取失败: {e}")
                  return

              # --- 🛡️ 核心升级：1:1 还原你的真实设备 (数字孪生) ---
              # 这会让 TG 官方认为你只是在用自己的手机
              async with TelegramClient(
                  StringSession(session), 
                  api_id, 
                  api_hash,
                  # 📱 你的设备型号 (一加 13)
                  device_model="OnePlus 13", 
                  # 🤖 你的系统版本 (Android 16 / ColorOS 16)
                  system_version="Android 16", 
                  # 🚀 你的 TG 客户端版本 (保持和你手机一致)
                  app_version="12.3.1",
                  # 🇨🇳 语言设置 (和截图一致)
                  lang_code="zh",
                  system_lang_code="zh-CN"
              ) as client:
                  
                  # --- 防封机制 1：全局拟人化赖床 ---
                  # 随机发呆 1~10 分钟，打破准点规律
                  global_delay = random.randint(60, 600)
                  print(f"😪 【拟人化】刚醒，先发呆 {global_delay} 秒再开始干活...")
                  await asyncio.sleep(global_delay)
                  
                  # --- 防封机制 2：彻底乱序执行 ---
                  random.shuffle(configs)
                  print(f"🔀 今日签到顺序已随机打乱，老司机准备发车...")

                  for item in configs:
                      try:
                          # --- 防封机制 3：模拟切换窗口 (15~50秒) ---
                          wait_time = random.randint(15, 50) 
                          print(f"⏳ 切换到 {item['peer']}，等待 {wait_time} 秒...")
                          await asyncio.sleep(wait_time)
                          
                          # --- 发送指令 ---
                          print(f"向 {item['peer']} 发送: {item['message']}")
                          await client.send_message(item['peer'], item['message'])
                          
                          # --- 防封机制 4：拟人化视觉反应 ---
                          if item.get('button'):
                              # 视觉延迟：2~5秒 (模拟眼睛寻找按钮)
                              reaction_time = random.randint(2, 5)
                              print(f"👀 等待面板弹出... ({reaction_time} 秒)")
                              await asyncio.sleep(reaction_time)
                              
                              found = False
                              async for bot_msg in client.iter_messages(item['peer'], limit=3):
                                  if bot_msg.buttons:
                                      for row in bot_msg.buttons:
                                          for btn in row:
                                              if item['button'] in btn.text:
                                                  # 触觉延迟：0.3~0.8秒 (模拟手指点击)
                                                  await asyncio.sleep(random.uniform(0.3, 0.8))
                                                  await btn.click()
                                                  print(f"✅ 极速点击：[{btn.text}]")
                                                  found = True
                                                  break
                                          if found: break
                                  if found: break
                              if not found:
                                  print(f"⚠️ 未找到包含 [{item['button']}] 的按钮")
                      except Exception as e:
                          print(f"❌ {item['peer']} 执行失败: {e}")

          if __name__ == '__main__':
              asyncio.run(main())
          EOF
          python run_checkin.py
